<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sendy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f5f7">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginView">
    
    <div class="login-card">
      <div class="logo"><img src="icon.png" alt="Sendy"> Sendy</div>
      <p class="subtitle">Share links and notes from anywhere</p>
      
      <div id="status"></div>
      
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••">
      </div>
      
      <div class="btn-group">
        <button id="loginBtn" class="primary">Login</button>
        <button id="registerBtn" class="secondary">Register</button>
      </div>

      <div style="text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-secondary); font-weight: 500;">Designed By Ayaz &lt;3</div>
    </div>

  </div>

  <!-- CHAT SCREEN -->
  <div id="chatView" style="display: none;">
    
    <header>
      <span class="title"><img src="icon.png" alt="Sendy">Sendy</span>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="darkModeBtn" class="dark-mode-toggle" title="Toggle Dark Mode">🌙</button>
        <button id="logoutBtn" class="header-btn" title="Logout">Logout</button>
      </div>
    </header>

    <div class="search-bar-container">
      <input type="text" id="searchInput" placeholder="🔍 Search name, description or link..." />
    </div>

    <main id="messages"></main>

    <footer>
      <textarea id="composer" placeholder="Type message or paste link..."></textarea>
      <button id="sendBtn">Send</button>
    </footer>

  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker registered!'))
        .catch(err => console.log('Service Worker error:', err));
    }
  </script>
</body>
</html>
